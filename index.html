// ── 1. REMPLACER addToWishlist() ─────────────────────────────
// Sauvegarde basique en Supabase + données enrichies en localStorage
async function addToWishlist(product) {
  if (!currentUser) { openAuth(); return; }
  if (cookieConsent !== 'yes') { alert('Accepte les cookies pour utiliser la wishlist !'); return; }

  // Sauvegarde Supabase (pour sync cross-device)
  await sb.from('wishlist').insert({
    user_id: currentUser.id,
    product_name: product.name,
    product_price: product.price,
    product_store: product.type === 'voyage' ? 'booking' : (product.store||''),
    product_url: product.url
  });

  // Sauvegarde localStorage (données enrichies pour affichage)
  try {
    const lsKey = 'huntify_wishlist_enriched';
    const existing = JSON.parse(localStorage.getItem(lsKey)||'[]');
    const dedup = existing.filter(i => i.name !== product.name);
    dedup.unshift({ ...product, addedAt: new Date().toISOString() });
    localStorage.setItem(lsKey, JSON.stringify(dedup.slice(0, 50)));
  } catch(e) {}

  document.dispatchEvent(new CustomEvent('wishlist-added', { detail: product.name }));
  msgs.push({from:'bot', text:`♡ <b>${product.name}</b> ajouté à ta wishlist !`});
  renderChat();
}

// ── 2. REMPLACER loadWishlist() ──────────────────────────────
// Affiche les données enrichies (hôtels, vols, budget) pour les voyages
async function loadWishlist() {
  if (!currentUser) return;
  const { data } = await sb.from('wishlist')
    .select('*').eq('user_id', currentUser.id)
    .order('created_at', {ascending:false}).limit(30);

  const el = document.getElementById('wishlistItems');
  if (!data || !data.length) {
    el.innerHTML = `<div style="text-align:center;padding:20px 0">
      <div style="font-size:32px;margin-bottom:8px">♡</div>
      <div style="color:#7c89a8;font-size:13px">Ta wishlist est vide.<br>Utilise le chat pour sauvegarder tes trouvailles !</div>
    </div>`;
    return;
  }

  // Récupérer les données enrichies depuis localStorage
  let enriched = {};
  try {
    const lsData = JSON.parse(localStorage.getItem('huntify_wishlist_enriched')||'[]');
    lsData.forEach(i => { enriched[i.name] = i; });
  } catch(e) {}

  const catColors = { budget:'#16a34a', confort:'#2f54ff', luxe:'#7c3aed' };
  const catLabels = { budget:'💚 Budget', confort:'💙 Confort', luxe:'💎 Luxe' };

  el.innerHTML = data.map(item => {
    const isVoyage = item.product_store === 'booking' || (item.product_name||'').includes('✈️') || (item.product_name||'').startsWith('Voyage');
    const rich = enriched[item.product_name] || {};
    const date = new Date(item.created_at).toLocaleDateString('fr', {day:'numeric', month:'short'});

    if (isVoyage && rich.hotels?.length) {
      // VOYAGE — affichage enrichi avec hôtels
      return `<div style="background:#fff;border:1px solid #e6ebf7;border-radius:14px;padding:14px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
          <div style="flex:1">
            <div style="font-size:14px;font-weight:800;color:#0e1430">${item.product_name}</div>
            <div style="font-size:11px;color:#7c89a8;margin-top:2px">${rich.subtitle||''}</div>
            <div style="font-size:13px;font-weight:800;color:#2f54ff;margin-top:4px">
              ${rich.price||''}
              ${rich.perPerson?`<span style="font-size:11px;color:#94a3b8;font-weight:400"> · ${rich.perPerson}</span>`:''}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:10px;color:#94a3b8">${date}</span>
            <button onclick="removeFromWishlist(${item.id})" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:18px;padding:0;line-height:1">×</button>
          </div>
        </div>
        <div style="margin-bottom:10px">
          <div style="font-size:10px;font-weight:800;color:#7c89a8;text-transform:uppercase;margin-bottom:5px">🏨 Hôtels</div>
          ${rich.hotels.map(h=>`
            <a href="${h.url||'#'}" target="_blank" style="display:flex;justify-content:space-between;align-items:center;background:#f8faff;border-radius:9px;padding:7px 10px;margin-bottom:4px;text-decoration:none;gap:8px">
              <span style="font-size:10px;font-weight:700;color:${catColors[h.cat]||'#2f54ff'}">${catLabels[h.cat]||'🏨'}</span>
              <span style="flex:1;font-size:12px;font-weight:600;color:#0e1430">${h.name}</span>
              <span style="font-size:12px;font-weight:700;color:#2f54ff">${h.price}</span>
            </a>`).join('')}
        </div>
        <div style="display:flex;gap:8px">
          <a href="${item.product_url||'#'}" target="_blank" style="flex:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1f2da0,#2f54ff);color:#fff;text-decoration:none;border-radius:10px;padding:9px;font-size:12px;font-weight:700">🏨 Booking</a>
          ${rich.flightUrl?`<a href="${rich.flightUrl}" target="_blank" style="flex:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0e1430,#1f2da0);color:#fff;text-decoration:none;border-radius:10px;padding:9px;font-size:12px;font-weight:700">✈️ Vols</a>`:''}
        </div>
      </div>`;
    } else if (isVoyage) {
      // VOYAGE — affichage simple (sans données enrichies)
      return `<div style="background:#fff;border:1px solid #e6ebf7;border-radius:14px;padding:14px;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#1f2da0,#2f54ff);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">✈️</div>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:700;color:#0e1430">${item.product_name}</div>
            <div style="font-size:11px;color:#7c89a8">${item.product_price||''} · ${date}</div>
          </div>
          <div style="display:flex;gap:6px">
            <a href="${item.product_url||'#'}" target="_blank" style="background:linear-gradient(135deg,#1f2da0,#2f54ff);color:#fff;text-decoration:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700">Voir</a>
            <button onclick="removeFromWishlist(${item.id})" style="background:#fff;border:1.5px solid #fee2e2;color:#ef4444;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit">✕</button>
          </div>
        </div>
      </div>`;
    } else {
      // PRODUIT
      return `<div style="background:#fff;border:1px solid #e6ebf7;border-radius:14px;padding:14px;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#2f54ff,#4a6bff);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🛍️</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;color:#0e1430;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.product_name}</div>
            <div style="font-size:11px;color:#7c89a8;margin-top:2px">${item.product_store} · ${item.product_price||'Prix non dispo'} · ${date}</div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <a href="${item.product_url||'#'}" target="_blank" style="background:linear-gradient(135deg,#2f54ff,#4a6bff);color:#fff;text-decoration:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700">Voir</a>
            <button onclick="removeFromWishlist(${item.id})" style="background:#fff;border:1.5px solid #fee2e2;color:#ef4444;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit">✕</button>
          </div>
        </div>
      </div>`;
    }
  }).join('');
}

// ── 3. AJOUTER exportItinerary() ────────────────────────────
// Exporte l'itinéraire en page imprimable / PDF
function exportItinerary(itinId) {
  // Chercher le conteneur de l'itinéraire par son ID
  const el = itinId ? document.getElementById(itinId) : null;

  // Si pas d'ID, chercher le dernier message bot contenant un itinéraire
  let content = '';
  if (el) {
    // Remonter au parent du message
    let parent = el.parentElement;
    while (parent && !parent.classList.contains('up')) parent = parent.parentElement;
    content = parent ? parent.innerHTML : el.outerHTML;
  } else {
    // Fallback : dernier message bot avec vols ou programme
    const botMsgs = document.querySelectorAll('[style*="5px 17px 17px 17px"]');
    botMsgs.forEach(m => {
      if (m.innerHTML.includes('Vols recommandés') || m.innerHTML.includes('Programme jour')) {
        content = m.innerHTML;
      }
    });
  }

  if (!content) {
    alert('Aucun itinéraire à exporter. Générez d\'abord votre voyage !');
    return;
  }

  const win = window.open('', '_blank', 'width=820,height=950');
  win.document.write(`<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon Itinéraire Huntify</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Plus Jakarta Sans',Arial,sans-serif; max-width:680px; margin:0 auto; padding:24px; color:#1e293b; background:#f4f7ff; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    a { color:#2f54ff; }
    @media print { .no-print { display:none !important; } body { background:#fff; padding:16px; } }
    .top-bar { background:#fff; border-radius:16px; padding:16px 20px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; border:1px solid #e6ebf7; }
    .logo { font-family:'Sora',sans-serif; font-size:20px; font-weight:800; color:#0e1430; }
    .logo span { color:#2f54ff; }
    .print-btn { background:linear-gradient(135deg,#2f54ff,#4a6bff); color:#fff; border:none; border-radius:10px; padding:10px 22px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
    .content { background:#fff; border-radius:16px; padding:20px; border:1px solid #e6ebf7; }
  </style>
</head>
<body>
  <div class="top-bar no-print">
    <div>
      <div class="logo">Hunt<span>ify</span> · Feuille de route</div>
      <div style="font-size:12px;color:#7c89a8;margin-top:2px">Générée le ${new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</div>
    </div>
    <button class="print-btn" onclick="window.print()">🖨️ Imprimer / PDF</button>
  </div>
  <div class="content">${content}</div>
</body>
</html>`);
  win.document.close();
}
