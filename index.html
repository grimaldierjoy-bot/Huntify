  @keyframes shimmer{0%,100%{opacity:.7}50%{opacity:1}}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .up{animation:up .3s ease both}
  .pop{animation:pop .25s ease both}
  .card{background:#fff;border-radius:20px;overflow:hidden;border:1.5px solid #e8edf8;transition:transform .22s,box-shadow .22s;cursor:pointer}

  .chip{background:#fff;border:1.5px solid #dde4f5;color:#3b5bdb;border-radius:100px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;font-family:inherit}
  .chip:hover{background:#3b5bdb;color:#fff;border-color:#3b5bdb}
  .tab{border:none;border-radius:100px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;background:transparent;color:#6366f1}

  .send{background:linear-gradient(135deg,#3b5bdb,#2563eb);border:none;color:#fff;font-weight:700;border-radius:14px;padding:13px 18px;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center}
  .send:hover{transform:scale(1.04);box-shadow:0 6px 20px rgba(59,91,219,.4)}
  .inp{background:#f5f7ff;border:2px solid #e8edf8;border-radius:14px;padding:13px 18px;font-size:14px;color:#1a1a2e;font-family:inherit;outline:none;transition:border .2s,box-shadow .2s;width:100%}
  .inp:focus{border-color:#3b5bdb;box-shadow:0 0 0 4px rgba(59,91,219,.08)}
  .inp::placeholder{color:#b0bdd8}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;font-size:11px;font-weight:700;padding:3px 10px;letter-spacing:.03em}
  .logo-pill{background:#fff;border:1.5px solid #e8edf8;border-radius:12px;padding:10px 22px;font-size:15px;font-weight:800;color:#475569;white-space:nowrap;letter-spacing:-.3px}

     ${["✅ Gratuit","🔒 Sans spam","⚡ Instantané"].map(t=>`<span style="font-size:12px;color:#64748b;font-weight:600">${t}</span>`).join("")}
   </div>
 </section>

 <footer style="background:#fff;border-top:1.5px solid #e8edf8;padding:28px 22px;text-align:center">
   <div style="font-size:22px;font-weight:900;color:#1a1a2e;margin-bottom:6px">Hunt<span style="color:#3b5bdb">ify</span></div>
   <div style="font-size:12px;color:#94a3b8;font-weight:500;margin-bottom:12px">huntify.shop · Le bon prix, trouvé pour vous.</div>
   <div style="font-size:10px;color:#cbd5e1;line-height:1.5;margin-bottom:16px;max-width:320px;margin-left:auto;margin-right:auto">En tant que Partenaire Amazon, Huntify réalise un bénéfice sur les achats remplissant les conditions requises.</div>
   <div style="display:flex;justify-content:center;gap:18px;font-size:12px;color:#94a3b8;flex-wrap:wrap">${["À propos","Contact","CGU","Confidentialité"].map(l=>`<span style="cursor:pointer">${l}</span>`).join("")}</div>
 </footer>`;
 renderChat();renderRev();
}

function renderChat(){
 const box=document.getElementById('chatBox');if(!box)return;
 box.innerHTML=msgs.map(m=>`<div class="up" style="display:flex;justify-content:${m.from==='user'?'flex-end':'flex-start'};align-items:flex-end;gap:8px">
   ${m.from==='bot'?'<div style="width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#3b5bdb,#4f46e5);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">🤖</div>':''}
   <div style="max-width:80%;padding:12px 16px;border-radius:${m.from==='user'?'18px 18px 4px 18px':'4px 18px 18px 18px'};background:${m.from==='user'?'linear-gradient(135deg,#3b5bdb,#4f46e5)':'#fff'};border:${m.from==='bot'?'1.5px solid #e8edf8':'none'};font-size:14px;line-height:1.65;color:${m.from==='user'?'#fff':'#374151'};box-shadow:0 2px 8px rgba(59,91,219,${m.from==='bot'?'.06':'.2'})">${m.text}</div>
 </div>`).join("")
 +(typing?`<div class="up" style="display:flex;align-items:flex-end;gap:8px"><div style="width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#3b5bdb,#4f46e5);display:flex;align-items:center;justify-content:center;font-size:16px">🤖</div><div style="display:flex;gap:5px;padding:14px 18px;background:#fff;border:1.5px solid #e8edf8;border-radius:4px 18px 18px 18px">${[0,1,2].map(i=>`<div style="width:8px;height:8px;border-radius:50%;background:#3b5bdb;animation:blink 1.1s ${i*.18}s infinite"></div>`).join("")}</div></div>`:"");
 box.scrollTop=box.scrollHeight;
}

function renderRev(){
 const box=document.getElementById('revBox');if(!box)return;
 const r=REVIEWS[revIdx];
 box.innerHTML=`<div style="animation:fadeIn .5s ease;background:#f8faff;border:1.5px solid #e8edf8;border-radius:18px;padding:20px 18px"><div style="color:#f59e0b;font-size:14px;margin-bottom:10px">★★★★★</div><p style="font-size:15px;color:#374151;line-height:1.6;font-weight:500;margin-bottom:14px">« ${r.txt} »</p><div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3b5bdb,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">${r.av}</div><div><div style="font-size:13px;font-weight:700;color:#1a1a2e">${r.name}</div><div style="font-size:11px;color:#94a3b8;font-weight:500">📍 ${r.loc} · Achat vérifié</div></div></div></div>`;
}

// ─── INTERACTIONS ───
function setTab(t){tab=t;render();}
function setRev(i){revIdx=i;render();}
async function send(txt){
 const input=document.getElementById('chatInput');
 const q=(txt||(input?input.value:"")).trim();if(!q)return;
 msgs.push({from:"user",text:q});if(input)input.value="";typing=true;renderChat();
 await new Promise(r=>setTimeout(r,1500));
 msgs.push({from:"bot",text:REPLIES[rIdx++%REPLIES.length](q)});typing=false;renderChat();
}
function alertModal(product,price){
 document.getElementById('alProduct').value=product||"";
 document.getElementById('alPrice').value=price?Math.round(price*0.9):"";
 document.getElementById('modalBg').classList.add('open');
}
function closeModal(){document.getElementById('modalBg').classList.remove('open');}
function submitAlert(){
 const p=document.getElementById('alProduct').value.trim();
 const pr=document.getElementById('alPrice').value.trim();
 const e=document.getElementById('alEmail').value.trim();
 if(!p||!pr||!e){alert("Merci de remplir tous les champs.");return;}
 if(!e.includes('@')){alert("Email invalide.");return;}
 // ⚠️ À CONNECTER : envoi vers la base de données (Supabase) + email (Resend)
 // Pour l'instant on confirme visuellement.
 document.querySelector('.modal').innerHTML=`<div style="text-align:center;padding:30px 10px"><div style="font-size:54px;margin-bottom:16px">✅</div><h3 style="font-size:22px;font-weight:900;color:#1a1a2e;margin-bottom:10px">Alerte activée !</h3><p style="font-size:14px;color:#64748b;line-height:1.6;margin-bottom:24px">Nous surveillons <b>${p}</b>.<br>Vous recevrez un email à <b>${e}</b> dès que le prix passe sous <b>${pr}€</b>.</p><button onclick="closeModal();render()" style="background:linear-gradient(135deg,#3b5bdb,#4f46e5);border:none;color:#fff;font-weight:800;border-radius:14px;padding:14px 32px;font-size:15px;cursor:pointer;font-family:inherit;width:100%">Parfait, merci !</button></div>`;
}
setInterval(()=>{if(!document.getElementById('modalBg').classList.contains('open')){revIdx=(revIdx+1)%REVIEWS.length;render();}},4500);
render();
</script>
</body>
